# Apps
# Any monitor

windowrule {
  name = pie Widget
  match:class = krita
  match:title = ^(Pie Widget — Krita)$

  no_anim = true
  no_blur = true
  no_shadow = true
  border_size = 0
}

windowrule {
  name = krita_pie_menu
  match:class = krita
  match:title = ^(Rotation Widget — Krita)$

  no_anim = true
  no_blur = true
  no_shadow = true
  border_size = 0
}
windowrule {
  name = no_stream
  match:class = org.mozilla.Thunderbird
  no_screen_share = true
}
windowrule {
  name = float_blender
  match:class = blender
  match:float = true
  size = (window_w*6) (window_h*5)
  center = true
}
