# Monitor 03
windowrule {
  name = pomodorolm
  match:class = ^(pomodorolm)$
  workspace = 19
  float = true
  move = (monitor_w*0.73) (monitor_h*0.05)
  xray = true
}

windowrule {
  name = spotify
  match:class = ^(spotify)$
  no_initial_focus = true
  workspace = 19
  fullscreen = true
}

windowrule {
  name = phone_audio_to_pc
  match:class = scrcpy
	match:title = 2201117SG
  no_initial_focus = true
  workspace = 19
}

